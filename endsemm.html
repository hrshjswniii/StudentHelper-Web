<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Form </title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font family: Arial,sans-serif ;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
        }
        .container{
            width: 350px;
            padding: 25px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10 px;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group{
            margin-bottom: 15px;
        }
        .input-group label{
            display: block;
            margin-bottom: 5px;
        }
        .input-group input{
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn{
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn:hover{
            background: #218838;
        }

    </style>
</head>

 <div class="container">
        <h2>Register</h2>
        <form>
            <div class="input-group">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" required>
            </div>

            <button class="btn" type="submit">Register</button>
        </form>
    </div>

</body>
</html>
